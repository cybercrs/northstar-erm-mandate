name: Native Northstar validation
on:
  push:
    branches: ['native/northstar-erm-mandate']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Development-only Python validates the unchanged original teaching app.
      # No Python package, interpreter or framework is shipped in /js/.
      - run: python -m pip install -r requirements.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python native/export.py
      - run: git diff --exit-code -- native/content.js native/tests/oracles.json native/tests/content-manifest.json
      - run: node --test native/tests/*.test.mjs
      - run: python -m unittest discover -s tests -v
      - run: python native/build.py
      - run: python native/tests/audit.py
      - run: python native/tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: northstar-native-validation
          path: native/review
